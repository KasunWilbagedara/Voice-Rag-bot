services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voice_rag_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: voicerag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  web:
    build: .
    container_name: voice_rag_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/voicerag
    env_file:
      - .env
    depends_on:
      - postgres

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: voice_rag_backend
    restart: always
    ports:
      - "9005:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/voicerag
      - PORT=8000
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  pgdata:
