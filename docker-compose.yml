services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voice_rag_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: voicerag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  web:
    build: .
    container_name: voice_rag_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/voicerag
      - PURE_RAG_BACKEND_URL=http://backend-pure-rag:8000
      - TOOLS_RAG_BACKEND_URL=http://backend-with-tools:8001
    env_file:
      - .env
    depends_on:
      - postgres

  backend-pure-rag:
    build:
      context: .
      dockerfile: backend_pure_rag/Dockerfile
    container_name: voice_rag_pure_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/voicerag
      - PORT=8000
      - PURE_RAG_PORT=8000
    env_file:
      - .env
    depends_on:
      - postgres

  backend-with-tools:
    build:
      context: .
      dockerfile: backend_with_tools/Dockerfile
    container_name: voice_rag_tools_backend
    restart: always
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/voicerag
      - PORT=8001
      - TOOLS_RAG_PORT=8001
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  pgdata:
